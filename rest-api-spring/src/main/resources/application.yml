spring:
  application:
    name: reuniones-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PUERTO:5432}/${DB_NOMBRE:reuniones}}
    username: ${DB_USUARIO:reuniones}
    password: ${DB_CLAVE:reuniones}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PUERTO_API:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aplicacion:
  zona-horaria: ${ZONA_HORARIA:America/La_Paz}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200,http://localhost:8081}
  jwt:
    secreto: ${JWT_SECRETO:}
    duracion: ${JWT_DURACION:PT1H}
